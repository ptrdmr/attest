{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Attest{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'surface:home' %}">Attest</a>
    {% if request.user.is_authenticated %}
      <nav aria-label="Application">
        <a href="{% url 'surface:project-list' %}">Projects</a>
        <a href="{% url 'surface:record' %}">Record</a>
        <a href="{% url 'surface:billing' %}">Billing</a>
      </nav>
      <form method="post" action="{% url 'surface:logout' %}">
        {% csrf_token %}
        <button class="button-link" type="submit">Log out</button>
      </form>
    {% endif %}
  </header>
  <main class="{% block main_class %}container{% endblock %}">
    {% if messages %}
      <div class="messages" aria-live="polite">
        {% for message in messages %}
          <p class="message {{ message.tags }}">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
