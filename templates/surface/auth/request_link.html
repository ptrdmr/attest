{% extends "base.html" %}
{% block title %}Log in · Attest{% endblock %}
{% block content %}
  <section class="card narrow">
    <h1>Log in to Attest</h1>
    <p>We will email you a secure link that expires in 15 minutes.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit">Email login link</button>
    </form>
  </section>
{% endblock %}
